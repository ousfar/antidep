name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint, format, typecheck, test og build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer avhengigheter
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatkontroll
        run: npm run format:check
      - name: Tallpåstander i styringsdokumentene
        run: ./scripts/verify-counts.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Tester
        run: npm run test
      - name: Produksjonsbygg
        run: npm run build

  database:
    name: Migrasjoner og databasetester på lokal Supabase-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer avhengigheter
        run: npm ci
      - name: Start lokal Supabase-stack
        run: npx supabase start
      - name: Kjør migrasjonene fra bunnen av
        run: npx supabase db reset
      - name: Databasetester (pgTAP)
        run: npm run db:test
      - name: Stopp stacken
        if: always()
        run: npx supabase stop
